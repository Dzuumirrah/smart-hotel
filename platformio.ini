; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

[env:arduino_uno_base]
platform = atmelavr
board = uno
framework = arduino

[env:hilman_smart-doorlock_esp]
extends = env:esp32dev
lib_deps = 
	miguelbalboa/MFRC522@^1.4.12
	bblanchon/ArduinoJson@^7.4.2
	adafruit/Adafruit Fingerprint Sensor Library@^2.1.3
	plerup/EspSoftwareSerial@^8.1.0
build_flags = 
	-D PROJECT_HILMAN
	-D ESP32_SERIAL

[env:fazla_lift]
extends = env:esp32dev
lib_deps = 
	chris--a/Keypad@^3.1.1
	madhephaestus/ESP32Servo@^3.0.0
	featherfly/SoftwareSerial@^1.0
	adafruit/Adafruit Fingerprint Sensor Library@^2.1.3
build_flags = -D PROJECT_FAZLA

[env:merlin_smokedetector_esp]
extends = env:esp32dev
lib_deps = 
	adafruit/DHT sensor library@^1.4.4
	adafruit/Adafruit Unified Sensor@^1.1.14
	featherfly/SoftwareSerial@^1.0
	adafruit/Adafruit Fingerprint Sensor Library@^2.1.3
build_flags = -D PROJECT_MERLIN

[env:merlin_smokedetector_uno]
extends = env:arduino_uno_base
lib_deps = 
	adafruit/DHT sensor library@^1.4.4
	adafruit/Adafruit Unified Sensor@^1.1.14
	featherfly/SoftwareSerial@^1.0
	adafruit/Adafruit Fingerprint Sensor Library@^2.1.3
build_flags = -D PROJECT_MERLIN
